# Blueprint de Render para la API de StudyPath AI (plan gratuito).
# Render → New → Blueprint → seleccionar este repositorio.
# Las variables con sync: false se capturan en el panel al crear el servicio.
services:
  - type: web
    name: studypath-api
    runtime: docker
    plan: free
    region: ohio            # misma región que la base de datos de Neon (AWS us-east-2)
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL       # cadena de conexión de Neon (sin pooler)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GOOGLE_AI_API_KEY
        sync: false
      - key: EMBEDDING_MODEL
        value: gemini-embedding-001
      - key: RAG_MIN_SIMILARITY
        value: "0.6"
      - key: CORS_ORIGIN        # URL del frontend en Vercel, p. ej. https://studypath-ai.vercel.app
        sync: false
